<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-extralight.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f7f8f2" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('carlos-portfolio-theme'); } catch {}
        const theme = preference === 'dark' || preference === 'light' ? preference : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b2226' : '#f7f8f2';
      })();
    </script>
    <meta name="description" content="Carlos Lopes: desenvolvimento front-end, Power Platform e processos. Conheça projetos reais que conectam visão operacional, dados e experiência do usuário." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Carlos Lopes | Desenvolvimento com visão de operação" />
    <meta property="og:description" content="Interfaces úteis e ferramentas para a rotina real. Projetos em React, TypeScript e experiência em Power Platform, dados e processos." />
    <title>Carlos Lopes | Front-end, Power Platform e Processos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
